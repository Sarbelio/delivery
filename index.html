<title>오늘 뭐 시켜 먹지?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4ee; --card:#fff; --ink:#2b2622; --muted:#7d736a; --line:#e6ddd1;
    --accent:#3d7a4f; --accent-soft:#e2f0e5; --warm:#c8641e; --warm-soft:#fbeadb;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1a1916; --card:#25231f; --ink:#f2ede6; --muted:#aaa094; --line:#3b3732;
      --accent:#6cc283; --accent-soft:#1f3326; --warm:#f0955a; --warm-soft:#3a2a1e; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  html,body{overscroll-behavior-y:none}
  .tip,.shop,.dish h3{-webkit-user-select:text;user-select:text}
  html{font-size:18px}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.55}
  .wrap{max-width:640px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  h1{font-size:1.75rem;font-weight:900;margin:0 0 4px;letter-spacing:-.5px}
  .sub{color:var(--muted);margin:0;font-size:1rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}
  .q{font-size:1.1rem;font-weight:700;margin:0 0 10px}
  .q small{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:4px}
  .big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bigopt{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:16px 10px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer}
  .bigopt span{display:block;font-size:.8rem;font-weight:400;color:var(--muted);margin-top:2px}
  .bigopt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:9px 15px;border-radius:999px;font:inherit;font-size:1rem;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .toggles{display:flex;flex-direction:column;gap:10px}
  .tg{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;background:transparent;color:var(--ink);font:inherit;font-size:1.02rem;text-align:left}
  .tg .sw{width:50px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
  .tg .sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
  .tg.on{border-color:var(--accent)}
  .tg.on .sw{background:var(--accent)}
  .tg.on .sw::after{left:25px}
  .go{display:block;width:100%;margin-top:18px;border:none;border-radius:16px;padding:18px;background:var(--warm);color:#fff;font:inherit;font-size:1.25rem;font-weight:900;cursor:pointer}
  .go:active,.btn:active,.bigopt:active,.chip:active,.tg:active,.swap:active{transform:scale(.97)}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:1rem;background:var(--bg);color:var(--ink);-webkit-appearance:none}
  .addrow input:focus{outline:none;border-color:var(--accent)}
  .addrow button{border:none;border-radius:12px;padding:0 20px;background:var(--accent);color:#fff;font:inherit;font-size:1rem;font-weight:700;cursor:pointer;flex:none}
  .hint{font-size:.85rem;color:var(--muted);margin:6px 0 10px}
  .chip.mine{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.mine::after{content:' ✕';font-size:.8rem;opacity:.8}
  .quick{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .quick summary{cursor:pointer;color:var(--muted);font-size:.95rem;padding:4px 0}
  .quick .chips{margin-top:8px}

<script>

// ================= 첫 화면과 같은 시간대별 하늘색 =================
const SKIES=[
  [0,   '#0f1b3d','#1d2b5c','#2e3a6e','#f3f1ff'],
  [5,   '#f6c9a8','#f9dfc4','#fdf1e2','#3a2a22'],
  [7,   '#bfe0f5','#dcefff','#f7f4ee','#24313b'],
  [11,  '#8fcaf0','#c3e4fa','#f2f7fb','#1f2d38'],
  [16,  '#f7b26a','#f6a081','#f3c6b8','#3a2320'],
  [18.5,'#5a3d7a','#c0607a','#f19a6b','#fff6f0'],
  [20,  '#0f1b3d','#1d2b5c','#2e3a6e','#f3f1ff'],
];
function paintSky(){
  const d=new Date(), hr=d.getHours()+d.getMinutes()/60;
  let s=SKIES[0]; for(const x of SKIES) if(hr>=x[0]) s=x;
  const band=document.getElementById('band');
  band.style.background=`linear-gradient(160deg, ${s[1]}, ${s[2]} 60%, ${s[3]})`; band.style.color=s[4];
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content',s[1]));
  document.documentElement.classList.toggle('night', hr>=18.5 || hr<5);
  document.getElementById('bdate').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`;
}
paintSky(); setInterval(paintSky,60000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) paintSky(); });

// ================= 추천 결과 창 =================
function openR(){ document.getElementById('rbg').hidden=false; document.body.style.overflow='hidden'; document.getElementById('rsheet').scrollTop=0; }
function closeR(){ document.getElementById('rbg').hidden=true; document.body.style.overflow=''; }
document.getElementById('rclose').onclick=closeR;
document.getElementById('rbg').addEventListener('click',e=>{ if(e.target.id==='rbg') closeR(); });
// 룰렛: 이름이 휘리릭 돌다가 천천히 멈춤
function spin(lines, done){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ done(); return; }
  const box=document.getElementById('result');
  box.innerHTML=`<div class="spin">${lines.map((l,i)=>`<div class="spinrow"><div class="kind">${l.label}</div><div class="spinname" id="sp${i}">…</div></div>`).join('')}<p class="spinmsg">두구두구… 고르는 중 🎲</p></div>`;
  let n=0, delay=45;
  const tick=()=>{
    lines.forEach((l,i)=>{ const el=document.getElementById('sp'+i); if(el && l.pool.length) el.textContent=l.pool[Math.floor(Math.random()*l.pool.length)]; });
    n++; delay*=1.13;
    if(n<16) setTimeout(tick,delay); else done();

const DAY=86400000;
function recentNames(){
  if(!S.norepeat) return new Set();
  const cut=Date.now()-3*DAY;
  return new Set(S.hist.filter(h=>h.ts>=cut).flatMap(h=>h.names));
}
// 최근에 먹은 것과 겹치는지: 같은 메뉴 이름, 같은 종류(시켜 먹은 것), 또는 집에서 해 먹은 요리 이름과 같은 경우
function isRecent(it, rec){
  if(rec.has(it.n)) return true;
  const recentGroups=new Set(S.hist.filter(h=>h.kind==='order' && h.ts>=Date.now()-3*DAY && S.norepeat).map(h=>h.g).filter(Boolean));
  if(recentGroups.has(it.g)) return true;
  const parts=it.n.split('·').map(s=>s.trim());
  return parts.some(p=>p.length>=2 && rec.has(p));
}
function candidates(exclude=[]){
  const rec=recentNames();
  return ITEMS.filter(it=>!it.off && !exclude.includes(it.n)
    && (!S.bud || it.p<=S.bud*1.1)
    && (!S.noraw || !it.t.includes('raw'))
    && (!S.moods.has('kid') || (it.t.includes('kid') && !it.t.includes('sp')))
    && (!S.moods.has('spicy') || it.t.includes('sp'))
    && !isRecent(it,rec));
}
function score(it){
  let s=1;
  ['heavy','light','soup','night'].forEach(m=>{ if(S.moods.has(m)) s*= it.t.includes(m)?3:0.35; });
  if(S.ppl==='1'){ if(it.t.includes('big')) s*=0.15; if(it.t.includes('share')) s*=0.7; }
  if(S.ppl==='4'){ if(it.t.includes('share')) s*=2.2; else s*=0.6; }
  return s;
}
function pickOne(list){
  if(!list.length) return null;
  const w=list.map(score); let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let k=0;k<list.length;k++){ r-=w[k]; if(r<=0) return list[k]; }
  return list[list.length-1];
}

  S.hist=store.get('dn_hist',[]);
  const list=candidates(); const picks=[];

  while(picks.length<3 && pool.length){
    const it=pickOne(pool); picks.push(it);
    pool=pool.filter(x=>x!==it && x.g!==it.g);
  }
  S.picks=picks; openR();
  spin([{label:'오늘의 배달 메뉴', pool:(list.length?list:ITEMS.filter(x=>!x.off)).map(x=>x.n)}], ()=>renderResult(true));
}

    renderHist(); renderNudge();
    $('decide').parentElement.outerHTML=`<div class="done">맛있게 드세요! 😊 기록해 둘게요.</div>
      <a class="gamelink" href="${GAMES_URL}">🎲 오늘은 니가 내라 · 사다리·룰렛·N분의1 →</a>`;
    setTimeout(()=>{ const rs=document.getElementById('rsheet'); rs.scrollTo({top:rs.scrollHeight,behavior:'smooth'}); },50);
  };
  $('copyWord').onclick=async()=>{
    const b=$('copyWord');
    try{ await navigator.clipboard.writeText(searchWord(top)); b.textContent='복사했어요 ✔ 배달앱 검색창에 붙여넣으세요'; }
    catch(e){ b.textContent='복사가 안 돼요. 메뉴 이름을 길게 눌러 복사해 주세요'; }
  };
}

// ---- 이번 주 배달 횟수 안내 ----
function renderNudge(){
  const n=S.hist.filter(h=>h.kind==='order' && h.ts>=Date.now()-7*DAY).length;
  $('nudge').innerHTML = n>=3 ? `<div class="nudge">이번 주에 벌써 <b>${n}번</b> 시켜 먹었어요. 오늘은 해 먹어 볼까요?
      <a href="${COOK_URL}">🍲 저녁 메뉴 고르러 가기 →</a></div>` : '';
}

// ---- 기록 ----
function ago(ts){
  const d=Math.round((new Date().setHours(0,0,0,0)-new Date(ts).setHours(0,0,0,0))/DAY);
  return d===0?'오늘':d===1?'어제':d+'일 전';
}
function renderHist(){
  const h=$('hist');
  if(!S.hist.length){ h.innerHTML='<p class="empty">아직 기록이 없어요. "이걸로 할게요"를 누르면 여기에 남아요.</p>'; return; }
  h.innerHTML=S.hist.slice().sort((a,b)=>b.ts-a.ts).slice(0,8).map(x=>`<div><span>${x.kind==='order'?'🛵':'🍲'} ${x.names.map(esc).join(' + ')}</span><small>${ago(x.ts)}</small></div>`).join('');
}
$('clearHist').onclick=()=>{ S.hist=[]; store.set('dn_hist',[]); renderHist(); renderNudge(); };

// ---- 화면 전환 ----
function showView(v){
  if(!['rec','menu'].includes(v)) v='rec';
  $('v-rec').hidden=v!=='rec'; $('v-menu').hidden=v!=='menu';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='menu') renderList();
  window.scrollTo(0,0);
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ try{ location.hash = b.dataset.v==='rec'?'':b.dataset.v; }catch(e){} showView(b.dataset.v); });
window.addEventListener('hashchange',()=>showView(location.hash.slice(1)));

// ---- 편집 창 ----
function openSheet(html){ $('sheet').innerHTML=html; $('sheetbg').hidden=false; document.body.style.overflow='hidden'; $('sheet').scrollTop=0; }
function closeSheet(){ $('sheetbg').hidden=true; $('sheet').innerHTML=''; document.body.style.overflow=''; }
$('sheetbg').addEventListener('click',e=>{ if(e.target===$('sheetbg')) closeSheet(); });
function twoStep(btn,label,fn){
  let armed=false;
  btn.onclick=()=>{
    if(!armed){ armed=true; btn.classList.add('sure'); btn.dataset.orig=btn.textContent; btn.textContent=label;
      setTimeout(()=>{ if(armed){ armed=false; btn.classList.remove('sure'); btn.textContent=btn.dataset.orig; } },4000); return; }
    armed=false; fn();
  };
}

// ---- 메뉴 목록 ----
let MQ='';
$('mq').addEventListener('input',e=>{ MQ=e.target.value.trim(); renderList(); });
function renderList(){
  const list=ITEMS.map((it,k)=>({it,k})).filter(({it})=>!MQ || it.n.includes(MQ) || it.g.includes(MQ))
    .sort((a,b)=>a.it.g.localeCompare(b.it.g,'ko') || a.it.n.localeCompare(b.it.n,'ko'));
  const offN=ITEMS.filter(x=>x.off).length;
  $('mcount').textContent=`메뉴 ${ITEMS.length}개`+(offN?` · 꺼 둔 메뉴 ${offN}개`:'');
  $('mlist').innerHTML = list.length ? list.map(({it,k})=>`<div class="lrow${it.off?' off':''}">
      <button type="button" class="row" data-k="${k}"><span class="nm">${esc(it.n)}</span><span class="meta">${esc(it.g)} · 1인 약 ${won(it.p)}</span>
      <span class="sub2">${it.t.map(t=>TAGNAME[t]).join(' ')}</span></button>
      <button type="button" class="onoff${it.off?'':' on'}" data-k="${k}" aria-label="추천에 쓰기">${it.off?'안 먹어요':'추천 O'}</button></div>`).join('')
    : '<p class="empty">찾는 메뉴가 없어요. "+ 새 메뉴"로 만들어 보세요.</p>';
  $('mlist').querySelectorAll('.row').forEach(r=>r.onclick=()=>itemSheet(+r.dataset.k));
  $('mlist').querySelectorAll('.onoff').forEach(b=>b.onclick=()=>{ const it=ITEMS[+b.dataset.k]; it.off=!it.off; saveItems(); renderList(); });
}
$('newItem').onclick=()=>itemSheet(-1);
twoStep($('resetItems'),'정말 되돌릴까요? 한 번 더 누르세요',()=>{
  ITEMS=DEF_ITEMS.map(cleanItem); store.set('dv_items',null); S.picks=[]; $('result').innerHTML=''; renderList();
  $('resetItems').textContent='기본 메뉴 목록으로 되돌렸어요 ✔';
});
function itemSheet(k){
  const isNew=k<0;
  const it = isNew ? {n:'',g:'',p:12000,t:[],tip:'',off:false} : {...ITEMS[k],t:[...ITEMS[k].t]};
  const groups=[...new Set(ITEMS.map(x=>x.g))].sort((a,b)=>a.localeCompare(b,'ko'));
  openSheet(`<h2>${isNew?'새 배달 메뉴':'메뉴 고치기'}</h2>
    <label class="f" for="fn">메뉴 이름</label><input id="fn" value="${esc(it.n)}" placeholder="예: 우리 동네 수제버거" maxlength="30">
    <label class="f" for="fg">종류 <small style="font-weight:400;color:var(--muted)">같은 종류는 최근에 먹었으면 함께 빠져요</small></label>
    <input id="fg" list="glist" value="${esc(it.g)}" placeholder="예: 버거" maxlength="15">
    <datalist id="glist">${groups.map(g=>`<option value="${esc(g)}">`).join('')}</datalist>
    <label class="f" for="fp">1인 대략 가격 (원, 배달비 포함)</label><input id="fp" type="number" inputmode="numeric" step="1000" min="1000" value="${it.p}">
    <label class="f">특징 <small style="font-weight:400;color:var(--muted)">추천할 때 쓰여요</small></label>
    <div class="chips" id="ft">${TAGS.map(([t,l])=>`<button type="button" class="chip${it.t.includes(t)?' on':''}" data-t="${t}">${l}</button>`).join('')}</div>
    <label class="f" for="ftip">주문 팁 (선택)</label><textarea id="ftip" rows="3" maxlength="300" placeholder="예: 세트로 시키면 콜라가 무료예요.">${esc(it.tip)}</textarea>
    <p class="err" id="ferr"></p>
    <div class="actions"><button type="button" class="btn ghost" id="fcancel">취소</button><button type="button" class="btn ok" id="fsave">저장</button></div>
    ${isNew?'':'<button type="button" class="del" id="fdel">이 메뉴 삭제</button>'}`);
  $('ft').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    const t=b.dataset.t; const i=it.t.indexOf(t); if(i>=0) it.t.splice(i,1); else it.t.push(t); b.classList.toggle('on',i<0);
  });
  $('fcancel').onclick=closeSheet;
  $('fsave').onclick=()=>{
    it.n=$('fn').value.trim(); it.g=$('fg').value.trim(); it.p=parseInt($('fp').value)||0; it.tip=$('ftip').value.trim();
    const err=t=>{ $('ferr').textContent=t; };
    if(!it.n) return err('메뉴 이름을 써 주세요.');
    if(ITEMS.some((x,j)=>x.n===it.n && j!==k)) return err('같은 이름의 메뉴가 이미 있어요.');
    if(!it.g) return err('종류를 써 주세요. (예: 치킨, 중식)');
    if(it.p<1000) return err('가격을 1,000원 이상으로 써 주세요.');
    const ni=cleanItem(it);
    if(isNew) ITEMS.push(ni); else ITEMS[k]=ni;
    saveItems(); closeSheet(); renderList();
  };
  if(!isNew) twoStep($('fdel'),'정말 삭제할까요? 한 번 더 누르세요',()=>{ ITEMS.splice(k,1); saveItems(); closeSheet(); renderList(); });
}

// ---- 다른 휴대폰으로 옮기기 ----
$('exportBtn').onclick=async()=>{
  const text='배달앱목록:'+JSON.stringify({v:1,items:ITEMS});
  try{ await navigator.clipboard.writeText(text); $('ioMsg').className='msg'; $('ioMsg').textContent='복사했어요 ✔ 카톡이나 문자에 붙여넣어 보내세요.'; }
  catch(e){ $('importBox').value=text; $('ioMsg').className='msg err'; $('ioMsg').textContent='자동 복사가 안 돼요. 아래 칸의 글자를 길게 눌러 전체 복사해 주세요.'; }
};
$('importBtn').onclick=()=>{
  const msg=(t,bad)=>{ $('ioMsg').className='msg'+(bad?' err':''); $('ioMsg').textContent=t; };
  const raw=$('importBox').value.trim(); const at=raw.indexOf('{');
  try{
    const o=JSON.parse(raw.slice(at)); const it=(o.items||[]).map(cleanItem).filter(x=>x.n);
    if(!it.length) throw 0;
    ITEMS=it; saveItems(); renderList(); $('importBox').value=''; msg(`불러왔어요 ✔ 메뉴 ${it.length}개`);
  }catch(e){ msg('붙여넣은 내용을 읽을 수 없어요. "내 목록 복사"로 만든 글자를 그대로 붙여넣어 주세요.',true); }
};

window.addEventListener('pageshow',()=>{ S.hist=store.get('dn_hist',[]); renderHist(); renderNudge(); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ S.hist=store.get('dn_hist',[]); renderHist(); renderNudge(); } });
renderHist(); renderNudge();
showView(location.hash.slice(1));
</script>
</body>
</html>
